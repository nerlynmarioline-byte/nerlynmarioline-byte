    <circle cx="34" cy="34" r="18" fill="#ff8fa6" fill-opacity=".18" stroke="#ff8fa6"/>
    <path d="M34 22l4 8 9 1-7 6 2 9-8-5-8 5 2-9-7-6 9-1z" fill="url(#accent)"/>
    <text x="66" y="40" fill="#ffd0d9" font-family="'Segoe UI',sans-serif" font-size="13" font-weight="700" letter-spacing=".6">PARTISIPASI NASIONAL</text>
    <text x="22" y="78" fill="#fff" font-family="'Segoe UI',sans-serif" font-size="16" font-weight="700">Aksi Milenial untuk Inklusivitas</text>
    <text x="22" y="101" fill="#fff" font-family="'Segoe UI',sans-serif" font-size="16" font-weight="700">dan Pelestarian Lingkungan</text>
    <text x="22" y="132" fill="#f2cdd4" font-family="'Segoe UI',sans-serif" font-size="13">Departemen PSdK · FISIP UGM, Yogyakarta</text>
